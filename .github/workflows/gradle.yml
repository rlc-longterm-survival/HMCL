name: Java CI

on:
  push:
  pull_request:
    paths-ignore:
      - '**.md'

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        distribution: 'liberica'
        java-version: '17'
        java-package: 'jdk+fx'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        cache-cleanup: never
    - name: Build with Gradle
      run: |
        if [[ ! -z "$MICROSOFT_AUTH_ID_OBSCURED" ]]; then
          export MICROSOFT_AUTH_ID="$(echo "$MICROSOFT_AUTH_ID_OBSCURED" | openssl enc -d -aes-256-cbc -pbkdf2 -salt -pass pass:'who_cares_13ad50208' -base64)"
          if [[ -z "$MICROSOFT_AUTH_ID" ]]; then
            echo "Malformed secret! 1" && exit 11
          fi
        fi
        if [[ ! -z "$CURSEFORGE_API_KEY_OBSCURED" ]]; then
          export CURSEFORGE_API_KEY="$(echo "$CURSEFORGE_API_KEY_OBSCURED" | openssl enc -d -aes-256-cbc -pbkdf2 -salt -pass pass:'who_cares_13ad50208' -base64)"
          if [[ -z "$CURSEFORGE_API_KEY" ]]; then
            echo "Malformed secret! 2" && exit 11
          fi
        fi
        xvfb-run --auto-servernum ./gradlew build --no-daemon --parallel
      env:
        JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
        MICROSOFT_AUTH_ID_OBSCURED: ${{ secrets.MICROSOFT_AUTH_ID_OBSCURED }}
        CURSEFORGE_API_KEY_OBSCURED: ${{ secrets.CURSEFORGE_API_KEY_OBSCURED }}
    - name: Get short SHA
      run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
    - name: Upload JAR
      uses: actions/upload-artifact@v7
      with:
        name: HMCL-${{ env.SHORT_SHA }}-jar
        path: HMCL/build/libs/HMCL-*.jar
        archive: false
    - name: Upload EXE
      uses: actions/upload-artifact@v7
      with:
        name: HMCL-${{ env.SHORT_SHA }}-exe
        path: HMCL/build/libs/HMCL-*.exe
        archive: false
    - name: Upload SH
      uses: actions/upload-artifact@v7
      with:
        name: HMCL-${{ env.SHORT_SHA }}-sh
        path: HMCL/build/libs/HMCL-*.sh
        archive: false
    - name: Upload DEB
      uses: actions/upload-artifact@v7
      with:
        name: HMCL-${{ env.SHORT_SHA }}-deb
        path: HMCL/build/libs/HMCL-*.deb
        archive: false
